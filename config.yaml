# WITNESS — configuration
# Edit these values; no code changes needed. Updates never overwrite this file.

# Check GitHub for a newer version on every launch and update automatically
# (then relaunch on the fresh code). No more manual downloads.
auto_update: true

# Play the low "boom" on the boot splash (the glitch hit). Windows only.
splash_sound: true

# Which game to detect. "marathon" uses the settings in this file; any other
# name loads games/<name>.yaml on top of them (made with the teach-a-game
# wizard: python main.py --teach). Profiles are shareable: PR yours. A profile
# should hold detection, theme and feature-gate keys only. Before you use a
# profile from someone else, read it like you would a config.yaml: look for
# paths, an obs: block or upload settings in it.
game: "marathon"

# Each game profile can carry a theme: block (colors + display name) that
# reskins the dashboard, on-screen banners, and reel stat cards. To restyle
# Marathon itself, uncomment and edit (see games/marathon.yaml for the keys):
# theme:
#   accent: "#9c58da"
#   danger: "#ff4d3d"

# =========================================================================
# DETECTION
#   Watches the center-screen personal reward popup that appears only when
#   YOU get a down/kill (e.g. "RUNNER DOWN +15 XP") and OCRs it. This is the
#   one approach that works for Marathon; audio + template matching were
#   tried and retired.
# =========================================================================
detection_mode: "popup"

# --- POPUP MODE settings ---
# Phrases that mean "you got a down/kill/assist". Case-insensitive, fuzzy-matched
# so OCR slips (e.g. RUNNER D0WN) still count. Add more once you see the exact
# wording for kills/assists (e.g. "ELIMINATED", "ASSIST").
popup_trigger_phrases:
  - "RUNNER DOWN"
  - "PRECISION DOWN"
  - "FINISHER"
  - "RUNNER ELIM"
popup_match_threshold: 85    # 0-100 fuzzy score to accept a phrase (higher = stricter)
popup_confirm_frames: 1      # popup must persist this many frames in a row to count.
                             # 1 = fire on the first clean read (best for CPU OCR,
                             # where a fast popup may only get one good frame).
                             # popup_cooldown_seconds guards against double-counting.
popup_absence_frames: 3      # popup must vanish this many frames before it can re-fire
popup_cooldown_seconds: 2.0  # minimum seconds between kills — stops a single popup
                             # whose OCR flickers from counting twice
# If any of these appear on screen, skip the WHOLE frame. Only use this for
# screens where you genuinely can't get a kill (death / exfil summary) — NOT
# for NPC popups, because those stack on-screen next to your real kill popups,
# and suppressing the frame would drop the real kill too. NPC popups ("UESC
# ...") are already ignored on their own: they don't match a trigger phrase.
suppress_phrases:
  - "SELF REVIVE"        # death screen
  - "GIVE UP"            # death screen
  - "RUNNER DAMAGE"      # exfil summary screen stats (in the OCR crop region)
  - "CREW REVIVES"       # exfil summary screen stats
  - "INVENTORY VALUE"    # exfil summary screen stats
# require_reward: only count a kill when a reward ("+15 XP", "+50", "+10 XP") is
# also on screen. This is the main filter against loading/menu-screen false
# positives (that text has no reward). Set false only if it misses real kills.
require_reward: true

# =========================================================================
# CAPTURE SOURCE
#   obs_virtualcam -> read OBS's Virtual Camera (recommended: OBS captures the
#                     game, we only read a webcam device -> lower anti-cheat
#                     exposure). Requires "Start Virtual Camera" in OBS.
#   screen         -> screenshot the monitor directly with mss (simpler, but our
#                     process does the screen grab).
# =========================================================================
capture_source: "screen"
obs_virtualcam_index: 0     # which webcam device is the OBS Virtual Camera (try 0,1,2)
monitor_index: 1            # only used when capture_source: screen (1 = primary)

# --- Region of the frame to OCR ---
# detect_region_frac (fractions 0-1 of the frame) is resolution-independent and
# WINS over detect_region. Set to where the RUNNER DOWN / FINISHER / RUNNER ELIM
# reward popups appear (center-lower). These values are measured from a 4K frame.
detect_region_frac:
  x: 0.375
  y: 0.71
  w: 0.19
  h: 0.12

# Legacy pixel region (used only if detect_region_frac is removed).
detect_region:
  x: 780
  y: 760
  w: 460
  h: 110

# true = log every OCR read to the console and logs/session_*.log (use when
# kills are missed, then set it back: it writes a line for every frame that
# has text on it).
debug_ocr: false

# --- Timing / performance ---
poll_fps: 5                 # frames/sec to capture + OCR. Higher = more chances to
                            # catch a fast popup with a clean read (matters on CPU
                            # OCR). Lower if it hurts game FPS.
ocr_threads: 2              # max CPU threads OCR may use (leaves cores for the game)
perf_log: true              # log RAM / GPU mem / OCR loop time / fps every few
                            # seconds to logs/perf_<time>.csv — open it after a
                            # session to see if memory creeps or OCR falls behind
perf_interval_seconds: 5    # how often the perf sampler writes a row
heat_streaks: true          # killstreak flair: HOT STREAK/RAMPAGE/MENACE/APEX
                            # toasts + call-outs as you climb, FIRST BLOOD, a
                            # SHARPSHOOTER precision streak, and a STREAK ENDED
                            # beat when you die. Streak persists until you die.
heat_overlays: true         # show the heat toasts on screen (respects show_overlays)
heat_callouts: true         # voice the heat call-outs (respects announcer_medals)
heat_precision_streak: 3    # consecutive precision kills -> SHARPSHOOTER
play_of_the_night: true     # at session end, cut the single best clip of the
                            # whole night into its own PLAY OF THE NIGHT reel
loot_goblin_decal: true     # stamp a LOOT GOBLIN decal over the match's top
                            # looter on a decorated copy of the exfil screenshot
# Which encoder renders the reels/montage/Shorts.
#   auto  - uses an NVIDIA encoder (h264_nvenc) when present, otherwise CPU
#   nvenc - force hardware; falls back to CPU if unavailable
#   cpu   - always libx264
# Hardware keeps the render off the CPU the game is using: NVENC is a dedicated
# encoder block on the GPU, separate from the shader cores the game uses, and
# renders several times faster. It costs a few hundred MB of VRAM; set cpu if
# VRAM is tight.
# A failed hardware encode automatically retries on CPU — a reel is never lost.
render_encoder: auto

# Detection canary: watch for WITNESS having silently stopped working — the
# failure where a game patch renames the kill popup, nothing errors, and you find
# out from an empty recap. It compares what the exfil panel CREDITED against what
# was detected, so it can tell "detection is broken" from "you had a quiet night".
# It only shouts when the game's own numbers prove it. Reported at session end.
detection_canary: true

# Catch OBS recording a BLACK SCREEN. WITNESS reads the screen directly, so its
# own frames look fine even when OBS's Display Capture has lost its display —
# which is how a whole night of clips came out black with nothing looking wrong.
# This asks OBS to screenshot its own program scene and checks it has content:
# once at startup (before you play) and every few minutes after, because a
# capture can break mid-session when a monitor sleeps or a driver reloads.
# A dark-but-varied game scene is fine; only a black or flat-colour frame warns.
check_black_capture: true
black_check_minutes: 5      # 0 disables the periodic re-check
# Put the warning ON SCREEN like the headshot skull, not just in the console —
# a console line is useless while you're in a match. This IGNORES show_overlays
# on purpose: that switch mutes flair, and muting flair must not also mute a
# warning that you're losing footage right now. It re-appears on every check
# while the capture is still black, and stops as soon as you fix it.
black_overlay: true
black_overlay_ms: 6000        # how long it stays up
black_overlay_size: 54        # font px
black_overlay_position: "custom:0.5,0.12"   # top-centre, out of the crosshair
black_callout: true           # also say it out loud (needs announcer_medals)
# Show the warning during SWEAT MODE (clutch) too. Sweat mode mutes flair so a
# tense 1vX isn't cluttered — but losing the footage of a clutch is exactly what
# you'd regret most, so this is NOT flair and shows by default.
# Set false to hold it until the clutch ends instead; it is never dropped.
black_overlay_in_clutch: true

# Clip viewer (dashboard -> Clips): every clip in a session with WHAT happened
# inside it and WHEN, so you can pick what belongs in a reel instead of trusting
# the automatic pick. Thumbnails are cached in <session>/thumbs/ on first view.
# Nothing here changes detection or the automatic reels.
clip_viewer: true

reel_tight_cuts: true       # reels start ~8s before each clip's first kill
                            # instead of playing the whole 30s buffer (kill
                            # timing recorded per clip at save time)
reel_preroll_seconds: 8     # lead-in before the kill on a MULTIKILL clip (the
                            # action is the content — don't delay it)
# Lead-in for a clip with a SINGLE ordinary kill. Longer on purpose: with one
# kill the interesting part is the approach, and a reel of bare kills with no
# setup reads as chaotic.
# Capped by your OBS Replay Buffer length — you can't keep more than it saves.
reel_context_preroll_seconds: 16
reel_manual_preroll_seconds: 18  # lead-in for manual +1 kills (the button
                            # press lands well after the actual kill)
disk_warn_gb: 10            # warn when the clip drive drops below this (GB).
                            # A session is 1-2 GB of clips/reels/Shorts and a
                            # full drive fails silently — no clips, no renders.
disk_critical_gb: 3         # louder warning: saves are about to start failing
resume_recap: true          # at launch, finish a recap build that got
                            # interrupted (app closed while rendering)
witness_report: true        # end-of-night WITNESS Report dossier (written case
                            # file saved to the session folder + printed)
witness_report_voice: true  # also render a spoken dossier (uses the announcer
                            # voice); falls back to reel_announcer if unset
witness_report_on_reel: true  # narrate the SESSION REEL with the spoken dossier
                            # (that's where it's actually useful — mixed over the
                            # reel's intro so watching the recap plays the report)
vram_ceiling_mb: 2500      # hand torch's cached VRAM back when it exceeds this.
                            # The allocator never shrinks on its own, so one burst
                            # of big reads keeps its peak reserved all session —
                            # measured 11-12GB on a 16GB card, which starves the
                            # game (that WAS the 'awful frames' bug). 0 disables.
perf_release_gpu: false     # force-release CUDA cache every ~60s. OFF by default:
                            # EasyOCR's cache is bounded, not leaking, so releasing
                            # just makes torch re-allocate and can slow OCR. Only turn
                            # on if a perf log shows GPU memory genuinely climbing.
min_save_interval_seconds: 2.0  # floor between OBS replay saves (avoid clip spam)
kill_coalesce_seconds: 8.0  # after a kill, wait this long for more kills before
                            # saving one clip (groups down+finisher into one clip)

# --- OCR ---
# engine: "easyocr" (GPU, robust; the tested default) or "tesseract".
# tesseract is EXPERIMENTAL: it needs the Tesseract program installed (if
# WITNESS can't find it, add the Tesseract-OCR folder to PATH), and it does
# not make the install smaller (setup installs EasyOCR and PyTorch either
# way). It only saves GPU memory while running.
ocr_engine: "easyocr"
ocr_upscale: 3             # upscale the cropped region Nx before OCR (helps small fonts).
                          # Capped by ocr_max_dim so it never makes a giant, slow image.
ocr_max_dim: 800          # hard cap on the long side of the image fed to OCR. Bounds
                          # OCR time (the popup text is large; 800px is plenty). Lower
                          # (e.g. 640) = faster OCR / less GPU contention with the game.

# --- OBS (obs-websocket v5, built into OBS 28+) ---
obs:
  host: "localhost"
  port: 4455
  password: ""                # paste from OBS: Tools -> WebSocket Server Settings
                              # -> Show Connect Info. Keep authentication ON:
                              # OBS listens on your network, so without a
                              # password anyone on your Wi-Fi can control it.
  counter_source: "KillCounter"  # name of the Text source in your OBS scene
                                 # that shows the kill count; set to "" to disable
  counter_format: "Kills: {count}"  # {count} is replaced with the running total
  auto_start_replay_buffer: true    # start the Replay Buffer on launch if not running
  auto_launch: true                 # if OBS itself isn't running, launch it and wait
  exe_path: ""                      # path to obs64.exe; empty = auto-find the
                                    # standard install location

# --- Kill signal (single-monitor friendly) ---
play_sound: false   # PC-side beep on each kill (off: the iPad dashboard dings
                    # instead — toggle with its SOUND button)
sound_file: ""      # optional path to a .wav to play instead of the beep, e.g.
                    # "C:\\Users\\you\\Downloads\\ding.wav"; empty = built-in beep

# --- On-screen event popup (needs the game in borderless windowed) ---
show_overlays: true                 # flash an image for special events
overlay_image: "witness_headshot.png"  # the image to flash (in this folder) —
                                    # the WITNESS headshot skull. Any PNG
                                    # in this folder works here.
overlay_size: 140                   # skull height in pixels. Try 90-200.
# Position: a named spot, OR "custom:fx,fy" where fx,fy are fractions (0-1) of
# the screen for the skull's CENTER. Default: centered above the kill popup.
#   named: top-left | top-right | top-center | bottom-left | bottom-right |
#          bottom-center | center
# Centered ABOVE the popup text — a fixed spot beside the popup collides with
# the +XP number because popup widths vary ("PRECISION DOWN [ASSIST]" is wider).
overlay_position: "custom:0.5,0.645"
overlay_margin: 40                  # gap from screen edge (named positions only)
overlay_duration_ms: 1400           # how long it stays on screen
overlay_alpha: 1.0                  # 0-1 opacity of the floating skull (lower = fainter)
overlay_events:                     # kill texts that trigger the image
  - "PRECISION DOWN"

# Text flashes (same animation as the skull, all click-through):
overlay_multikill: true    # "DOUBLE KILL" / "TRIPLE KILL" when kills land together
overlay_clip_saved: true   # small "CLIP SAVED" bottom-right when a clip lands
overlay_reel_ready: true   # "HIGHLIGHTS READY" when the match reel finishes

# Halo-style announcer VOICE shouting "Double kill!" etc. when kills land
# together (uses announcer_voice; rendered once per voice, then works offline).
# NOTE: a down + its finisher is ONE kill — multikills need multiple DOWNS.
# Off by default — a voice in your ears mid-match isn't for everyone. Turn it
# on here or in the dashboard Settings; it's one of the best features.
announcer_medals: false

# TEAM WIPE banner + call-out: three distinct enemy deaths (elim/finisher
# popups, yours or assists) within ~2 minutes — in trios that's the squad.
team_wipe: true
team_wipe_size: 3      # deaths that make a wipe (2 for duos)

# AUTO-SWEAT: when the squad panel shows every teammate DOWNED — you're the
# last one standing — all flair mutes automatically (no banners, no voices,
# no skull) while clips keep recording. The clutch confirms itself by how it
# ends: the panel clears (you revived them) or you exfil alive. If you got
# kills while solo, the announcer celebrates THEN — after the pressure, not
# during it. Going down just ends it quietly.
auto_sweat: true
clutch_callout: "CLUTCH!"   # what the announcer yells after a confirmed clutch.
                            # Any phrase works. Needs announcer_medals: true.

# --- Clips + recap ---
organize_clips: true   # rename each saved clip by event+time and sort into a
                       # per-session folder ("Marathon Sessions/<date_time>/")
make_card: true        # at session end, save a shareable match-card PNG to stats/cards/
make_montage: false    # at session end, stitch the session's clips into one
                       # plain montage (needs ffmpeg). Off by default — the
                       # session reel below is the better version of this.
make_shorts: false     # at session end, render each clip as a 1080x1920 vertical
                       # (blurred background + centered gameplay) ready for
                       # YouTube Shorts/TikTok -> session folder /shorts/.
                       # Off by default: extra render time + disk per clip.
shorts_labels: true    # bake a label into each short: the event tag
                       # (e.g. "DOWN + FINISHER") and the game name
ffmpeg_path: ""        # empty = find ffmpeg automatically; an ffmpeg.exe in
                       # this folder always wins. Or a full path to ffmpeg.exe.

# --- Kill feed name tracking (the Menace Report) ---
# Read gamertags off the kill feed: who you downed (scanned right after each
# kill popup) and who downed you (scanned on the downed screen). Logged with
# timestamps to stats/encounters.csv; the Stats page shows most-downed
# opponents with "last downed", plus your nemeses. Set gamertag to your EXACT
# in-game name so the feed lines can be matched.
track_names: true
gamertag: ""   # your EXACT in-game name; empty = Menace Report, kill-name
               # chyrons and streamer alerts are off

# Marathon prints MAP LOCATION names on screen (zone banners, objective text),
# and they get read as gamertags: "ALGAE PONDS" and "QUARANTINE" are Dire Marsh
# POIs, not runners — and ALGAE PONDS was once promoted to PRIME TARGET in the
# WITNESS Report. With this on, a name matching a known POI is skipped and the
# reason is PRINTED, never dropped silently (a silent filter would hide a wrong
# gamertag above just as well). The POI list lives in encounters.MAP_LOCATIONS.
# Names containing a digit are always treated as players, since no POI has one.
ignore_map_locations: true

# Streamer watchlist: gamertags that get the BIG alert when they show up in
# your kill feed — on-screen banner, voiced call-out, and if one of them
# downs YOU the clip is saved automatically (your kills are clipped anyway).
# Fuzzy-matched, so OCR slips still hit. Needs track_names: true.
# Empty by default — add YOUR favorite streamers/rivals, e.g.:
#   - "MARSHYY"
streamer_watchlist: []
watchlist_clip_deaths: true

# At match end, when the EXFILTRATED summary screen appears, grab it once and
# log the real match stats (elims/downs/damage/run time) to stats/match_stats.csv
# — and print an audit: game's kill count vs what we detected.
capture_exfil_stats: true

# In trios/duos, the exfil screen shows every player's panel — parse teammates
# too (names + stats -> stats/squad_stats.csv). Powers the squad leaderboard
# and buddy economy tracking on the dashboard's Stats page.
squad_stats: true

# Detect which runner/shell you're playing (one full-frame scan when the
# deployment screen appears). Feeds per-runner stats and the announcer
# ("...on Glitch, drops four kills").
runner_detection: true

# After each match's exfil, build an ESPN-style highlight reel (stat title card
# + that match's clips) into <session>/reels/ and pop it up on the iPad
# dashboard for instant rewatching.
make_match_reels: true

# --- OPTIONAL VOICE UPGRADE: ElevenLabs (best-in-class hype delivery) ---
# 1. Make a free account at elevenlabs.io -> Profile -> API key
# 2. Save the key into a file named  elevenlabs_key.txt  in this folder
# That's it — every call-out and reel voiceover upgrades automatically, and
# falls back to the built-in voice if the key is missing or out of credits.
# Call-outs render once and cache, so the free tier is plenty.
# Which ElevenLabs voice: empty = "Callum" (deep, hoarse; a free premade voice).
# Audition voices in their Text to Speech playground, then paste the winner's
# voice ID here (from the voice's page).
elevenlabs_voice_id: ""

# Announcer voice for the "(announced)" reel. Human-sounding Microsoft neural
# voice (needs internet while the reel builds; falls back to the offline
# robotic voice without it). Try en-US-ChristopherNeural, en-GB-RyanNeural...
# Full list: .venv\Scripts\python -m edge_tts --list-voices
announcer_voice: "en-US-ChristopherNeural"
# The neural voice is ONLINE: the text it speaks is sent to Microsoft's speech
# service to be voiced. That text includes announcer_player_name below and, in
# the WITNESS Report, other players' gamertags from the kill feed. false = use
# the offline Windows voice instead (robotic, but the text stays on this PC).
# ElevenLabs, if you added a key above, is separate and not affected by this.
tts_online: true
# Deepen any voice; "-18Hz" on Christopher = the deep broadcast voice.
announcer_pitch: "-18Hz"
# How the announcer says your name (spell it phonetically if it reads oddly).
announcer_player_name: ""   # empty = "your runner" in match reels,
                            # "the runner" in the WITNESS Report
reel_music_volume: 0.08   # 0-1 loudness of the music bed under the game audio
                          # (0.08 = quiet background; 0 = off, 0.22 = old level)

# At session end, build ONE reel of the whole session's clips (title card +
# Play of the Game) -> <session>/session_reel.mp4
make_session_reel: true

# Tidy the session folder when the recap finishes: per-kill clips (and their
# .json sidecars) move into clips/, exfil screenshots into exfil/. The montage,
# session reel, dossier, reels/ and shorts/ stay where they are. Files are MOVED
# inside the session folder — nothing is deleted and nothing leaves — so it's
# reversible by dragging them back. Readers handle either layout.
tidy_session_folder: true

# --- YouTube auto-upload (one-time setup required; see YOUTUBE.md) ---
# Needs a one-time free setup: a Google Cloud project with "YouTube Data API v3"
# enabled, an OAuth client (type: Desktop app) saved as client_secret.json in
# this folder. No billing account or card required — the API is quota-limited
# (~6 uploads/day), not billed. First upload opens a browser once.
#
# IMPORTANT: publish the OAuth consent screen (Google Auth Platform -> Audience
# -> Publish app), or uploads stop after 7 days: while it sits in "Testing",
# Google expires the refresh token after 7 DAYS and uploads quietly stop.
#
# What auto-uploads at session end: four separate toggles below (also in the
# dashboard Settings), all off by default. Leave them off until the setup is
# done. With ~6 uploads/day, leave shorts off unless you post a lot (a busy
# session makes many).

# Title for uploaded videos. Placeholders: {date} {kind} {downs} {elims} {kills}
# {game} {match}. {kind} is "Session Montage" / "Session Reel" / "Match 3".
# YouTube caps titles at 100 characters; a typo here falls back to the default
# rather than costing you the upload.
youtube_title_template: "WITNESS Auto Reel — {date}"

youtube_upload_montage: false         # the end-of-session montage (every clip)
youtube_upload_session_reel: false   # the one whole-session highlight reel
youtube_upload_match_reels: false    # each match's highlight reel
youtube_upload_shorts: false         # every vertical Short (quota-heavy)
youtube_privacy: "unlisted"   # unlisted | private | public

# --- Live web dashboard (view on a phone/iPad browser over the LAN) ---
web_dashboard: true    # serve a live kill feed page. false = the console
                       # launcher serves none; the window app always runs one
                       # (the window IS the dashboard). To keep the dashboard
                       # on this PC only, in either launcher, set
                       # web_lan: false (below).
web_port: 8000         # open http://<your-PC-IP>:8000 on the device
web_lan: true          # true = reachable from devices on your Wi-Fi (the iPad).
                       # NOTE: the dashboard has no password — anyone on the same
                       # network can see stats and press its buttons. On a home
                       # network that's fine; on shared/public Wi-Fi set false
                       # (this PC only).
# Let the WITNESS iOS app find this PC on your Wi-Fi by itself (Bonjour), so
# you never type 192.168.x.x. Only active when web_lan is true. Advertises the
# port and the PC's name — nothing about your sessions.
bonjour_discovery: true

# --- Logging ---
session_log: "session_log.csv"
